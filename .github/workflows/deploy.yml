name: FTP Deploy

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    # ✅ Add Node so we can build the Vite/React app
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: "20"
        cache: "npm"

    # ✅ Install dependencies
    - name: Install dependencies
      run: npm ci

    # ✅ Build the production site into /dist
    - name: Build
      run: npm run build

    # ✅ Deploy ONLY the dist folder to Bluehost
    - name: FTP Deploy
      uses: SamKirkland/FTP-Deploy-Action@4.3.0
      with:
        server: ${{ secrets.FTP_HOST }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}

        # IMPORTANT: deploy dist, not the whole repo
        local-dir: dist/

        # keep your existing server path (usually /public_html/)
        server-dir: ${{ secrets.FTP_PATH }}
        port: ${{ secrets.FTP_PORT }}
        git-ftp-args: "--insecure"
